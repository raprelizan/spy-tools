<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpyScope Pro - Ads Intelligence Dashboard</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #121934;
      --card: rgba(20, 28, 52, 0.82);
      --card-border: rgba(169, 186, 255, 0.2);
      --text: #e6ebff;
      --muted: #9aa9d8;
      --primary: #6f8cff;
      --accent: #48d8c0;
      --danger: #ff6a84;
      --warning: #ffba49;
      --success: #52d680;
      --shadow: 0 20px 35px rgba(4, 8, 25, 0.45);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px circle at 3% 0%, rgba(114, 89, 240, 0.22), transparent 40%),
        radial-gradient(900px circle at 90% 8%, rgba(60, 205, 180, 0.16), transparent 35%),
        linear-gradient(135deg, #090d1d, #0d1430 48%, #11193b);
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: 290px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid rgba(170, 190, 255, 0.15);
      background: rgba(8, 12, 28, 0.75);
      backdrop-filter: blur(8px);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 42px; height: 42px; border-radius: 12px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #6f8cff, #48d8c0);
      font-weight: 700; color: #08112b;
    }
    .brand h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
    .brand small { color: var(--muted); }

    .sidebar-section h3 {
      margin: 0 0 12px;
      font-size: 0.85rem;
      color: #b8c5f5;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .saved-list, .history-list { display: grid; gap: 8px; max-height: 240px; overflow: auto; }
    .saved-item, .history-item {
      background: rgba(111, 140, 255, 0.12);
      border: 1px solid rgba(132, 158, 255, 0.24);
      border-radius: 10px;
      padding: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .chip-btn, .chip-delete {
      border: none;
      cursor: pointer;
      border-radius: 8px;
      color: #dfe7ff;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 8px;
      font-size: 0.76rem;
    }
    .chip-delete { color: #ffd8df; background: rgba(255, 106, 132, 0.2); }

    .content { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }

    .topbar h2 { margin: 0; font-size: 1.1rem; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    button, select, input {
      border: 1px solid rgba(169, 186, 255, 0.25);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
    }

    button { cursor: pointer; transition: all .2s ease; }
    button:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .btn-primary {
      background: linear-gradient(135deg, #6f8cff, #5872ef);
      border: none;
      color: #fff;
      font-weight: 600;
    }
    .btn-accent {
      background: linear-gradient(135deg, #48d8c0, #2cb4a0);
      border: none;
      color: #04221d;
      font-weight: 700;
    }

    .search-panel, .stats-panel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .search-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.75rem; color: #bcc8f2; text-transform: uppercase; letter-spacing: 0.06em; }

    .field.keyword { grid-column: span 2; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      background: rgba(111, 140, 255, 0.1);
      border: 1px solid rgba(126, 153, 255, 0.24);
      border-radius: 12px;
      padding: 10px;
    }
    .stat .label { color: var(--muted); font-size: 0.8rem; }
    .stat .value { font-size: 1.2rem; font-weight: 700; margin-top: 4px; }

    .status { min-height: 22px; color: #c6d2ff; font-size: 0.86rem; }
    .status.error { color: #ffb5c2; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 18px auto;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results-header { display:flex; justify-content: space-between; align-items:center; gap:10px; }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(305px, 1fr));
      gap: 12px;
    }

    .ad-card {
      border-radius: 12px;
      background: rgba(17, 25, 49, 0.9);
      border: 1px solid rgba(155, 177, 255, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .2s ease, border-color .2s ease;
    }
    .ad-card:hover { transform: translateY(-2px); border-color: rgba(111, 140, 255, 0.55); }
    .media-wrap {
      position: relative;
      background: #0d1430;
      aspect-ratio: 16/9;
      display: grid;
      place-items: center;
      border-bottom: 1px solid rgba(155, 177, 255, 0.2);
    }

    .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: cover; }

    .meta { padding: 12px; display:flex; flex-direction:column; gap:8px; }
    .title { font-weight: 650; line-height: 1.35; }
    .badges { display:flex; flex-wrap:wrap; gap:6px; }
    .badge { font-size: .72rem; padding:4px 8px; border-radius:999px; background: rgba(111, 140, 255, 0.17); border: 1px solid rgba(130, 156, 255, 0.35); }

    .text {
      color: #d6defd;
      font-size: 0.88rem;
      line-height: 1.45;
      max-height: 44px;
      overflow: hidden;
      transition: max-height .2s ease;
      white-space: pre-wrap;
    }
    .text.expanded { max-height: 420px; }

    .kv { font-size: 0.82rem; color: #c8d4ff; }

    .card-actions { display:flex; flex-wrap: wrap; gap:8px; margin-top: 6px; }

    .pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 14px 0 4px; }

    .empty {
      text-align: center;
      border: 1px dashed rgba(132, 158, 255, 0.35);
      border-radius: 12px;
      padding: 20px;
      color: #9fb1ed;
    }

    @media (max-width: 1200px) {
      .search-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .field.keyword { grid-column: span 3; }
      .stats-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid rgba(170, 190, 255, 0.15); }
      .search-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .field.keyword { grid-column: span 2; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .search-grid, .stats-grid { grid-template-columns: 1fr; }
      .field.keyword { grid-column: span 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">SS</div>
        <div>
          <h1>SpyScope Pro</h1>
          <small>Ads Intelligence Suite</small>
        </div>
      </div>

      <section class="sidebar-section">
        <h3>Saved Keywords</h3>
        <div id="savedKeywords" class="saved-list"></div>
      </section>

      <section class="sidebar-section">
        <h3>Search History</h3>
        <div id="searchHistory" class="history-list"></div>
      </section>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h2>Premium Ads Discovery Dashboard</h2>
          <small style="color:var(--muted)">Meta + TikTok ad intelligence from SearchApi.io</small>
        </div>
        <div class="actions">
          <button id="saveKeywordBtn">Save Keyword</button>
          <button id="exportCsvBtn" class="btn-accent">Export CSV</button>
        </div>
      </header>

      <section class="search-panel">
        <form id="searchForm" class="search-grid">
          <div class="field keyword">
            <label for="keyword">Keyword *</label>
            <input id="keyword" required placeholder="e.g. skincare serum" />
          </div>
          <div class="field">
            <label for="platform">Platform</label>
            <select id="platform">
              <option value="facebook_ads">facebook_ads</option>
              <option value="tiktok_ads">tiktok_ads</option>
            </select>
          </div>
          <div class="field"><label for="country">Country (ISO)</label><input id="country" placeholder="US" maxlength="2" /></div>
          <div class="field"><label for="language">Language</label><input id="language" placeholder="en" /></div>
          <div class="field"><label for="startDate">Start Date</label><input id="startDate" type="date" /></div>
          <div class="field"><label for="endDate">End Date</label><input id="endDate" type="date" /></div>
          <div class="field">
            <label for="adFormat">Ad Format</label>
            <select id="adFormat">
              <option value="">All</option>
              <option value="video">Video</option>
              <option value="image">Image</option>
              <option value="carousel">Carousel</option>
            </select>
          </div>
          <div class="field">
            <label for="limit">Results Limit</label>
            <select id="limit">
              <option>10</option>
              <option>20</option>
              <option selected>50</option>
              <option>100</option>
            </select>
          </div>
          <div class="field">
            <label for="sortBy">Sort By</label>
            <select id="sortBy">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="most_active">Most active</option>
            </select>
          </div>
          <div class="field">
            <label for="activeOnly">Active Status</label>
            <select id="activeOnly">
              <option value="all">All</option>
              <option value="active">Active only</option>
            </select>
          </div>
          <div class="field" style="align-self:end">
            <button class="btn-primary" type="submit">Search Ads</button>
          </div>
        </form>
        <div id="status" class="status"></div>
        <div id="spinner" class="spinner"></div>
      </section>

      <section class="stats-panel">
        <div class="stats-grid" id="statsGrid"></div>
      </section>

      <section>
        <div class="results-header">
          <h3 style="margin:0">Results</h3>
          <small id="pageInfo" style="color:var(--muted)"></small>
        </div>
        <div id="results" class="results-grid"></div>
        <div class="pagination">
          <button id="prevPage">Prev</button>
          <span id="paginationLabel">Page 1</span>
          <button id="nextPage">Next</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    // 🔐 Insert your SearchApi.io API key below
    const API_KEY = "REPLACE_WITH_SEARCHAPI_KEY";
    const API_URL = "https://www.searchapi.io/api/v1/search";
    const STORAGE_KEYS = { saved: "spyscope_saved_keywords", history: "spyscope_search_history" };

    const state = {
      results: [],
      currentPage: 1,
      pageSize: 12,
      stats: {},
      lastQuery: null,
      loading: false,
    };

    const dom = {
      form: document.getElementById("searchForm"),
      keyword: document.getElementById("keyword"),
      platform: document.getElementById("platform"),
      country: document.getElementById("country"),
      language: document.getElementById("language"),
      startDate: document.getElementById("startDate"),
      endDate: document.getElementById("endDate"),
      adFormat: document.getElementById("adFormat"),
      limit: document.getElementById("limit"),
      sortBy: document.getElementById("sortBy"),
      activeOnly: document.getElementById("activeOnly"),
      status: document.getElementById("status"),
      spinner: document.getElementById("spinner"),
      results: document.getElementById("results"),
      statsGrid: document.getElementById("statsGrid"),
      exportCsvBtn: document.getElementById("exportCsvBtn"),
      saveKeywordBtn: document.getElementById("saveKeywordBtn"),
      savedKeywords: document.getElementById("savedKeywords"),
      searchHistory: document.getElementById("searchHistory"),
      prevPage: document.getElementById("prevPage"),
      nextPage: document.getElementById("nextPage"),
      paginationLabel: document.getElementById("paginationLabel"),
      pageInfo: document.getElementById("pageInfo"),
    };

    function safeGet(obj, path, fallback = "N/A") {
      try {
        const value = path.split(".").reduce((acc, k) => acc?.[k], obj);
        return value ?? fallback;
      } catch {
        return fallback;
      }
    }

    function parseArray(input) {
      if (!input) return [];
      return Array.isArray(input) ? input : [input];
    }

    function detectMediaType(ad) {
      const mediaUrl = safeGet(ad, "creative.media_url", "") || safeGet(ad, "image", "") || safeGet(ad, "video", "");
      const explicit = String(safeGet(ad, "format", "")).toLowerCase();
      if (explicit.includes("video")) return "video";
      if (explicit.includes("image")) return "image";
      if (explicit.includes("carousel")) return "carousel";
      if (/\.(mp4|webm|mov)($|\?)/i.test(mediaUrl)) return "video";
      if (/\.(jpg|jpeg|png|gif|webp|bmp|svg)($|\?)/i.test(mediaUrl)) return "image";
      if (parseArray(ad.carousel_images).length > 1) return "carousel";
      return "image";
    }

    function normalizeAd(raw, platform) {
      const startDate = safeGet(raw, "start_date", safeGet(raw, "ad.start_date", "N/A"));
      const endDate = safeGet(raw, "end_date", safeGet(raw, "ad.end_date", "N/A"));
      const mediaUrl = safeGet(raw, "creative.media_url", "") || safeGet(raw, "image", "") || safeGet(raw, "video", "") || safeGet(raw, "creative.image_url", "") || safeGet(raw, "creative.video_url", "");
      const advertiserLink = safeGet(raw, "advertiser.page_link", "") || safeGet(raw, "page_link", "") || safeGet(raw, "advertiser.url", "");
      const spend = safeGet(raw, "estimated_spend", safeGet(raw, "spend", null));
      const impressions = safeGet(raw, "estimated_impressions", safeGet(raw, "impressions", null));
      const adId = String(safeGet(raw, "ad_id", safeGet(raw, "id", crypto.randomUUID())));
      const text = safeGet(raw, "ad_text", safeGet(raw, "text", safeGet(raw, "creative.body", "N/A")));
      const title = safeGet(raw, "ad_title", safeGet(raw, "title", safeGet(raw, "creative.title", "Untitled Ad")));
      const status = String(safeGet(raw, "status", safeGet(raw, "ad_status", "unknown"))).toLowerCase();
      const landingPage = safeGet(raw, "landing_page", safeGet(raw, "url", "N/A"));
      const libraryLink = safeGet(raw, "ad_library_link", safeGet(raw, "library_url", "N/A"));
      return {
        adId,
        title,
        text,
        advertiserName: safeGet(raw, "advertiser.name", safeGet(raw, "advertiser_name", "N/A")),
        advertiserLink: advertiserLink || "N/A",
        mediaUrl: mediaUrl || "",
        startDate,
        endDate,
        countries: parseArray(safeGet(raw, "country_targeting", safeGet(raw, "countries", []))).join(", ") || "N/A",
        estimatedSpend: spend ?? "N/A",
        estimatedImpressions: impressions ?? "N/A",
        platform,
        cta: safeGet(raw, "cta", safeGet(raw, "call_to_action", "N/A")),
        status: status.includes("active") ? "active" : status.includes("inactive") ? "inactive" : "unknown",
        landingPage,
        libraryLink,
        format: detectMediaType(raw),
      };
    }

    function uniqueByAdId(list) {
      const map = new Map();
      list.forEach((item) => {
        if (!map.has(item.adId)) map.set(item.adId, item);
      });
      return [...map.values()];
    }

    function setLoading(on) {
      state.loading = on;
      dom.spinner.style.display = on ? "block" : "none";
    }

    function setStatus(message, isError = false) {
      dom.status.textContent = message;
      dom.status.classList.toggle("error", isError);
    }

    function buildQueryParams() {
      const keyword = dom.keyword.value.trim();
      if (!keyword) throw new Error("Keyword is required.");
      if (!API_KEY || API_KEY.includes("REPLACE")) throw new Error("Please set your SearchApi.io API key in the API_KEY constant.");

      const params = new URLSearchParams({
        engine: dom.platform.value,
        q: keyword,
        api_key: API_KEY,
        limit: dom.limit.value,
      });

      const optionalMap = {
        country: dom.country.value.trim().toUpperCase(),
        language: dom.language.value.trim(),
        start_date: dom.startDate.value,
        end_date: dom.endDate.value,
      };

      Object.entries(optionalMap).forEach(([key, val]) => {
        if (val) params.set(key, val);
      });

      return params;
    }

    function sortResults(data) {
      const sortBy = dom.sortBy.value;
      const parseTime = (value) => value && value !== "N/A" ? new Date(value).getTime() : 0;
      data.sort((a, b) => {
        if (sortBy === "most_active") {
          const da = a.status === "active" ? 1 : 0;
          const db = b.status === "active" ? 1 : 0;
          if (da !== db) return db - da;
          return parseTime(b.startDate) - parseTime(a.startDate);
        }
        return sortBy === "oldest" ? parseTime(a.startDate) - parseTime(b.startDate) : parseTime(b.startDate) - parseTime(a.startDate);
      });
    }

    function applyFilters(data) {
      const format = dom.adFormat.value;
      const activeOnly = dom.activeOnly.value === "active";
      return data.filter((item) => {
        const formatMatch = !format || item.format === format;
        const activeMatch = !activeOnly || item.status === "active";
        return formatMatch && activeMatch;
      });
    }

    function computeStats(data) {
      const activeCount = data.filter((ad) => ad.status === "active").length;
      const videoCount = data.filter((ad) => ad.format === "video").length;
      const imageCount = data.filter((ad) => ad.format === "image").length;
      const spends = data.map((ad) => Number(ad.estimatedSpend)).filter((n) => !Number.isNaN(n));
      const avgSpend = spends.length ? (spends.reduce((a, b) => a + b, 0) / spends.length).toFixed(2) : "N/A";
      const countryDist = {};
      data.forEach((ad) => {
        if (ad.countries && ad.countries !== "N/A") {
          ad.countries.split(",").map((c) => c.trim()).filter(Boolean).forEach((country) => {
            countryDist[country] = (countryDist[country] || 0) + 1;
          });
        }
      });
      const topCountries = Object.entries(countryDist).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([c, count]) => `${c} (${count})`).join(", ") || "N/A";

      state.stats = { total: data.length, activeCount, videoCount, imageCount, avgSpend, countries: topCountries };
      dom.statsGrid.innerHTML = [
        ["Total results", state.stats.total],
        ["Active ads", state.stats.activeCount],
        ["Video ads", state.stats.videoCount],
        ["Image ads", state.stats.imageCount],
        ["Avg. est. spend", state.stats.avgSpend],
      ].map(([label, value]) => `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div></div>`).join("");

      const countryNode = document.createElement("div");
      countryNode.className = "stat";
      countryNode.style.gridColumn = "1 / -1";
      countryNode.innerHTML = `<div class="label">Countries distribution (top)</div><div class="value" style="font-size:1rem">${state.stats.countries}</div>`;
      dom.statsGrid.appendChild(countryNode);
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderMedia(ad) {
      if (!ad.mediaUrl) return `<div style="color:var(--muted)">No preview available</div>`;
      if (ad.format === "video") {
        return `<video controls preload="none" loading="lazy" src="${escapeHtml(ad.mediaUrl)}"></video>`;
      }
      return `<img loading="lazy" src="${escapeHtml(ad.mediaUrl)}" alt="Ad creative" />`;
    }

    function paginate() {
      const totalPages = Math.max(1, Math.ceil(state.results.length / state.pageSize));
      if (state.currentPage > totalPages) state.currentPage = totalPages;
      const start = (state.currentPage - 1) * state.pageSize;
      const pageData = state.results.slice(start, start + state.pageSize);
      dom.pageInfo.textContent = `${state.results.length} ads found`;
      dom.paginationLabel.textContent = `Page ${state.currentPage} / ${totalPages}`;
      dom.prevPage.disabled = state.currentPage <= 1;
      dom.nextPage.disabled = state.currentPage >= totalPages;
      return pageData;
    }

    function renderResults() {
      const pageData = paginate();
      if (!pageData.length) {
        dom.results.innerHTML = `<div class="empty">No ads match your current filters.</div>`;
        return;
      }
      dom.results.innerHTML = pageData.map((ad) => `
        <article class="ad-card" data-ad-id="${escapeHtml(ad.adId)}">
          <div class="media-wrap">${renderMedia(ad)}</div>
          <div class="meta">
            <div class="title">${escapeHtml(ad.title)}</div>
            <div class="badges">
              <span class="badge">${escapeHtml(ad.platform)}</span>
              <span class="badge">${escapeHtml(ad.format)}</span>
              <span class="badge">${escapeHtml(ad.status)}</span>
            </div>
            <div class="text">${escapeHtml(ad.text)}</div>
            <div class="kv">Advertiser: ${escapeHtml(ad.advertiserName)}</div>
            <div class="kv">Start: ${escapeHtml(ad.startDate)} · End: ${escapeHtml(ad.endDate)}</div>
            <div class="kv">Countries: ${escapeHtml(ad.countries)} · Spend: ${escapeHtml(ad.estimatedSpend)} · Impr: ${escapeHtml(ad.estimatedImpressions)}</div>
            <div class="kv">CTA: ${escapeHtml(ad.cta)} · Ad ID: ${escapeHtml(ad.adId)}</div>
            <div class="card-actions">
              <button data-action="toggle">Expand / Collapse</button>
              <button data-action="copy">Copy Ad Text</button>
              <button data-action="advertiser">Open Advertiser</button>
              <button data-action="landing">Landing Page</button>
              <button data-action="library">Ad Library Link</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function toCsv(results) {
      const columns = [
        "ad_title", "ad_text", "advertiser_name", "advertiser_page_link", "ad_creative", "ad_start_date", "ad_end_date",
        "country_targeting", "estimated_spend", "estimated_impressions", "ad_id", "platform", "cta", "ad_status", "landing_page_link", "ad_library_link"
      ];
      const esc = (value) => `"${String(value ?? "N/A").replaceAll('"', '""')}"`;
      const rows = results.map((ad) => [
        ad.title, ad.text, ad.advertiserName, ad.advertiserLink, ad.mediaUrl, ad.startDate, ad.endDate,
        ad.countries, ad.estimatedSpend, ad.estimatedImpressions, ad.adId, ad.platform, ad.cta, ad.status, ad.landingPage, ad.libraryLink
      ].map(esc).join(","));
      return [columns.join(","), ...rows].join("\n");
    }

    function downloadCsv() {
      if (!state.results.length) return setStatus("No results to export.", true);
      const blob = new Blob([toCsv(state.results)], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `spyscope_export_${Date.now()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      setStatus("CSV exported successfully.");
    }

    function getStorage(key) {
      try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch { return []; }
    }

    function setStorage(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }

    function renderSavedKeywords() {
      const items = getStorage(STORAGE_KEYS.saved);
      dom.savedKeywords.innerHTML = items.length ? items.map((word, i) => `
        <div class="saved-item">
          <button class="chip-btn" data-search-word="${escapeHtml(word)}">${escapeHtml(word)}</button>
          <button class="chip-delete" data-delete-word="${i}">Delete</button>
        </div>
      `).join("") : `<div class="empty">No saved keywords.</div>`;
    }

    function renderHistory() {
      const history = getStorage(STORAGE_KEYS.history);
      dom.searchHistory.innerHTML = history.length ? history.map((item) => `
        <div class="history-item">
          <button class="chip-btn" data-history='${escapeHtml(JSON.stringify(item))}'>${escapeHtml(item.keyword)} · ${escapeHtml(item.platform)}</button>
          <small style="color:var(--muted)">${new Date(item.timestamp).toLocaleDateString()}</small>
        </div>
      `).join("") : `<div class="empty">No recent searches.</div>`;
    }

    function saveKeyword() {
      const word = dom.keyword.value.trim();
      if (!word) return setStatus("Enter a keyword first.", true);
      const items = getStorage(STORAGE_KEYS.saved);
      if (!items.includes(word)) {
        items.unshift(word);
        setStorage(STORAGE_KEYS.saved, items.slice(0, 25));
      }
      renderSavedKeywords();
      setStatus("Keyword saved.");
    }

    function addHistory(query) {
      const history = getStorage(STORAGE_KEYS.history);
      history.unshift({ ...query, timestamp: Date.now() });
      setStorage(STORAGE_KEYS.history, history.slice(0, 10));
      renderHistory();
    }

    async function searchAds() {
      try {
        setLoading(true);
        setStatus("Searching ads...");

        const params = buildQueryParams();
        state.lastQuery = {
          keyword: dom.keyword.value.trim(),
          platform: dom.platform.value,
          country: dom.country.value.trim().toUpperCase(),
          language: dom.language.value.trim(),
        };

        const response = await fetch(`${API_URL}?${params.toString()}`);
        const payload = await response.json();

        if (!response.ok) {
          const errText = payload?.error || payload?.message || `HTTP ${response.status}`;
          if (/quota|limit|credits|429/i.test(errText)) {
            throw new Error(`Quota exceeded: ${errText}`);
          }
          throw new Error(`Search API error: ${errText}`);
        }

        const rawAds = payload.ads || payload.results || payload.data || [];
        const normalized = uniqueByAdId(rawAds.map((item) => normalizeAd(item, dom.platform.value)));
        const filtered = applyFilters(normalized);
        sortResults(filtered);

        state.results = filtered;
        state.currentPage = 1;
        computeStats(state.results);
        renderResults();
        addHistory(state.lastQuery);
        setStatus(`Loaded ${state.results.length} ads.`);
      } catch (error) {
        console.error(error);
        state.results = [];
        computeStats(state.results);
        renderResults();
        setStatus(error.message || "Search failed.", true);
      } finally {
        setLoading(false);
      }
    }

    function bindEvents() {
      dom.form.addEventListener("submit", (e) => {
        e.preventDefault();
        searchAds();
      });

      dom.exportCsvBtn.addEventListener("click", downloadCsv);
      dom.saveKeywordBtn.addEventListener("click", saveKeyword);

      dom.prevPage.addEventListener("click", () => {
        if (state.currentPage > 1) {
          state.currentPage -= 1;
          renderResults();
        }
      });
      dom.nextPage.addEventListener("click", () => {
        const max = Math.max(1, Math.ceil(state.results.length / state.pageSize));
        if (state.currentPage < max) {
          state.currentPage += 1;
          renderResults();
        }
      });

      [dom.adFormat, dom.activeOnly, dom.sortBy].forEach((node) => {
        node.addEventListener("change", () => {
          if (!state.results.length) return;
          state.results = applyFilters(uniqueByAdId(state.results));
          sortResults(state.results);
          computeStats(state.results);
          state.currentPage = 1;
          renderResults();
        });
      });

      dom.results.addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;
        const card = btn.closest(".ad-card");
        if (!card) return;
        const ad = state.results.find((x) => x.adId === card.dataset.adId);
        if (!ad) return;

        const action = btn.dataset.action;
        if (action === "toggle") {
          card.querySelector(".text").classList.toggle("expanded");
        } else if (action === "copy") {
          await navigator.clipboard.writeText(ad.text || "");
          setStatus("Ad text copied.");
        } else if (action === "advertiser") {
          if (ad.advertiserLink && ad.advertiserLink !== "N/A") window.open(ad.advertiserLink, "_blank", "noopener");
        } else if (action === "landing") {
          if (ad.landingPage && ad.landingPage !== "N/A") window.open(ad.landingPage, "_blank", "noopener");
        } else if (action === "library") {
          if (ad.libraryLink && ad.libraryLink !== "N/A") window.open(ad.libraryLink, "_blank", "noopener");
        }
      });

      dom.savedKeywords.addEventListener("click", (e) => {
        const searchBtn = e.target.closest("[data-search-word]");
        if (searchBtn) {
          dom.keyword.value = searchBtn.dataset.searchWord;
          searchAds();
          return;
        }
        const delBtn = e.target.closest("[data-delete-word]");
        if (delBtn) {
          const idx = Number(delBtn.dataset.deleteWord);
          const words = getStorage(STORAGE_KEYS.saved);
          words.splice(idx, 1);
          setStorage(STORAGE_KEYS.saved, words);
          renderSavedKeywords();
        }
      });

      dom.searchHistory.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-history]");
        if (!btn) return;
        const item = JSON.parse(btn.dataset.history);
        dom.keyword.value = item.keyword || "";
        dom.platform.value = item.platform || "facebook_ads";
        dom.country.value = item.country || "";
        dom.language.value = item.language || "";
        searchAds();
      });
    }

    function init() {
      renderSavedKeywords();
      renderHistory();
      computeStats([]);
      renderResults();
      bindEvents();
      setStatus("Ready. Enter a keyword to start searching ads.");
    }

    init();
  </script>
</body>
</html>
